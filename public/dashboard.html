<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PuREPower - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M13.5 2 5 13.5h5.5L9.5 22 19 9.5h-5.8L13.5 2Z" /></svg>
      </span>
      <span class="brand-name">PuREPower<span class="brand-sub">Dealer Lead Router</span></span>
    </a>
    <nav>
      <a href="index.html">New Lead</a>
      <a href="dashboard.html" aria-current="page">Dashboard</a>
    </nav>
  </header>

  <main class="wide">
    <div class="page-head">
      <h2>Lead dashboard</h2>
      <p class="muted">Updates live. A status change is saved as soon as you pick it. Repeat enquiries from the same phone number are kept and marked.</p>
    </div>

    <h3 class="section-title">Leads by status</h3>
    <div class="stats-row" id="status-stats"></div>

    <h3 class="section-title">Leads by dealer</h3>
    <div class="stats-row" id="dealer-stats"></div>

    <div class="card leads-card">
      <h2>All leads</h2>
      <div class="filters">
        <select id="filter-dealer" aria-label="Filter by dealer">
          <option value="">All dealers</option>
        </select>
        <select id="filter-status" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option>New</option>
          <option>Contacted</option>
          <option>Converted</option>
          <option>Lost</option>
        </select>
        <select id="filter-repeat" aria-label="Show repeat enquiries">
          <option value="">All leads</option>
          <option value="repeat">Repeat enquiries only</option>
        </select>
      </div>
      <div class="table-wrap">
        <table id="leads-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Pincode</th>
              <th>Product</th>
              <th>Dealer</th>
              <th>Source</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="leads-tbody">
            <tr><td colspan="7" class="muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
